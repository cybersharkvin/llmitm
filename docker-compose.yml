services:
  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"

  llmitm:
    build: .
    volumes:
      - ./mitmproxy-ai-tool:/workspace
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    depends_on:
      - juiceshop
