services:
  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"

  llmitm:
    build: .
    volumes:
      - ./mitmproxy-ai-tool:/workspace
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    working_dir: /workspace
    stdin_open: true
    tty: true
    depends_on:
      - juiceshop
